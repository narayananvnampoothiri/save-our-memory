<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Save Our Memory - A private, secure digital memory platform for couples, families, and close friends to cherish photos and videos.">
  <title>Save Our Memory • Private Digital Memory Sanctuary</title>

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- PWA & Mobile App Settings -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#D46B6B">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- Application Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="app-container header-inner">
      <!-- Brand Logo -->
      <a href="#home" class="brand-logo">
        <span class="brand-heart">❤️</span>
        <span>Save Our Memory</span>
      </a>

      <!-- Desktop Nav for Authenticated Users -->
      <ul class="nav-links" id="authenticated-nav" style="display: none;">
        <li class="nav-item" data-route="home">
          <a href="#home"><span>🏠</span> Home</a>
        </li>
        <li class="nav-item" data-route="memories">
          <a href="#memories"><span>❤️</span> Memories</a>
        </li>
        <li class="nav-item" data-route="photos">
          <a href="#photos"><span>📷</span> Photos</a>
        </li>
        <li class="nav-item" data-route="videos">
          <a href="#videos"><span>🎥</span> Videos</a>
        </li>
        <li class="nav-item" data-route="shared">
          <a href="#shared"><span>🔗</span> Shared With Me</a>
        </li>
        <li class="nav-item" data-route="connections">
          <a href="#connections"><span>👥</span> Connections</a>
        </li>
      </ul>

      <!-- Guest Nav -->
      <div id="guest-nav" class="flex items-center gap-3">
        <button class="btn btn-secondary text-sm" onclick="Views.openAuthModal('login')">Sign In</button>
        <button class="btn btn-primary text-sm" onclick="Views.openAuthModal('register')">Create Vault ❤️</button>
      </div>

      <!-- Authenticated Header Actions -->
      <div class="header-actions" id="header-auth-actions" style="display: none;">
        <!-- Add Memory CTA -->
        <button class="btn btn-add-memory" onclick="Views.openAddMemoryModal()" title="Add Memory">
          <span>➕</span> Add Memory
        </button>

        <!-- Search Icon -->
        <button class="icon-btn" onclick="Views.openSearchModal()" title="Search People">
          <span>🔍</span>
        </button>

        <!-- Notification Bell -->
        <button class="icon-btn" onclick="Views.openNotificationsDropdown()" title="Notifications">
          <span>🔔</span>
          <span class="badge-count" id="notif-badge" style="display: none;">0</span>
        </button>

        <!-- Theme Toggle -->
        <button class="icon-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme">
          <span id="theme-icon">🌙</span>
        </button>

        <!-- User Profile Dropdown -->
        <div style="position: relative;">
          <button class="user-menu-btn" id="user-menu-btn">
            <div class="user-avatar" id="header-user-avatar">?</div>
            <span style="font-size: 0.85rem; font-weight: 600;" id="header-user-name">Me</span>
            <span style="font-size: 0.75rem; color: var(--text-soft);">▾</span>
          </button>

          <div class="dropdown-menu" id="user-dropdown">
            <a href="#profile" class="dropdown-item">
              <span>👤</span> View Profile
            </a>
            <a href="#connections" class="dropdown-item">
              <span>👥</span> Manage Connections
            </a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item text-danger" onclick="handleLogout()">
              <span>🚪</span> Sign Out
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="main-content" id="app">
    <!-- Injected dynamically by router -->
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-nav" id="mobile-bottom-nav" style="display: none;">
    <a href="#home" class="mobile-nav-item" data-route="home">
      <span class="icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="#memories" class="mobile-nav-item" data-route="memories">
      <span class="icon">❤️</span>
      <span>Timeline</span>
    </a>
    <a href="javascript:void(0)" class="mobile-nav-item" onclick="Views.openAddMemoryModal()">
      <span class="icon" style="color: var(--primary);">➕</span>
      <span style="color: var(--primary); font-weight: 600;">Add</span>
    </a>
    <a href="#shared" class="mobile-nav-item" data-route="shared">
      <span class="icon">🔗</span>
      <span>Shared</span>
    </a>
    <a href="#profile" class="mobile-nav-item" data-route="profile">
      <span class="icon">👤</span>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Application Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/views.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
